<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- chain links -->
  <rect x="4" y="18" width="16" height="12" rx="6" stroke="#6366f1" stroke-width="3" fill="none"/>
  <rect x="28" y="18" width="16" height="12" rx="6" stroke="#818cf8" stroke-width="3" fill="none"/>
  <!-- connector -->
  <line x1="20" y1="24" x2="28" y2="24" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <!-- trace dots -->
  <circle cx="10" cy="10" r="3" fill="#6366f1"/>
  <circle cx="24" cy="6" r="3" fill="#818cf8"/>
  <circle cx="38" cy="10" r="3" fill="#6366f1"/>
  <line x1="10" y1="10" x2="24" y2="6" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="24" y1="6" x2="38" y2="10" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
