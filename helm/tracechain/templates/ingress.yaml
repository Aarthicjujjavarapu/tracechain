{{- if .Values.ingress.enabled }}
---
# Dashboard ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tracechain.fullname" . }}-dashboard
  labels:
    {{- include "tracechain.dashboard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.dashboardHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tracechain.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
---
# Backend ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tracechain.fullname" . }}-backend
  labels:
    {{- include "tracechain.backend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.backendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tracechain.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
