# TraceChain Helm chart — default values
# Override in values.prod.yaml or with --set flags

nameOverride: ""
fullnameOverride: ""

# ── backend ───────────────────────────────────────────────────────────────────
backend:
  image:
    repository: ghcr.io/aarthicjujjavarapu/tracechain-backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  # Liveness / readiness probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # Extra environment variables injected into the backend pod
  extraEnv: []
  # - name: SOME_VAR
  #   value: "some-value"

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── dashboard ─────────────────────────────────────────────────────────────────
dashboard:
  image:
    repository: ghcr.io/aarthicjujjavarapu/tracechain-dashboard
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # URL the *browser* uses to call the backend API.
  # In-cluster: use the backend ClusterIP service name.
  # If exposing via Ingress, set to the public backend URL.
  apiUrl: ""   # default: http://<release>-backend:8000

  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── database ──────────────────────────────────────────────────────────────────
database:
  # "sqlite" (single-replica, uses PVC) or "external" (PostgreSQL recommended)
  type: sqlite

  sqlite:
    # SQLite database file path inside the backend pod
    path: /data/tracechain.db
    persistence:
      enabled: true
      storageClass: ""      # "" → cluster default
      accessMode: ReadWriteOnce
      size: 2Gi

  # Used when database.type = "external"
  # Provide DATABASE_URL either here or via existingSecret.databaseUrlKey
  external:
    url: ""   # postgresql://user:pass@host:5432/dbname

# ── secrets ───────────────────────────────────────────────────────────────────
secrets:
  # Name of an existing Secret that contains DATABASE_URL (optional).
  # When set, the chart does NOT create its own Secret.
  existingSecret: ""
  databaseUrlKey: DATABASE_URL

  # Inline values — only used when existingSecret is empty.
  # Prefer passing with --set secrets.openaiApiKey=sk-... rather than storing in values files.
  openaiApiKey: ""
  anthropicApiKey: ""

# ── ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  #   nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  #   cert-manager.io/cluster-issuer: letsencrypt-prod

  # Two separate hosts (recommended):
  dashboardHost: tracechain.example.com
  backendHost: api.tracechain.example.com

  tls: []
  # - secretName: tracechain-tls
  #   hosts:
  #     - tracechain.example.com
  #     - api.tracechain.example.com

# ── service account ───────────────────────────────────────────────────────────
serviceAccount:
  create: false
  name: ""
