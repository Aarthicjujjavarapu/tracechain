name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish-pypi:
    name: PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        working-directory: sdk
        run: python -m build

      - name: Upload to PyPI
        working-directory: sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/* --skip-existing

  publish-npm:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        working-directory: sdk-js
        run: npm ci && npm run build

      - name: Publish
        working-directory: sdk-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" > /dev/null 2>&1; then
            echo "Version ${VERSION} already published, skipping"
          else
            npm publish --access public
          fi

  publish-helm:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gh-pages branch can be updated

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Package chart
        run: helm package helm/tracechain --destination .chart-pkg

      - name: Checkout gh-pages branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true

      - name: Update Helm repo index and push
        run: |
          # Work in a temp dir that merges new package with existing index
          mkdir -p /tmp/helm-repo
          cp .chart-pkg/*.tgz /tmp/helm-repo/

          # Fetch existing index.yaml from gh-pages if it exists
          git show origin/gh-pages:index.yaml > /tmp/helm-repo/index.yaml 2>/dev/null || true

          # Rebuild index, merging with existing entries
          REPO_URL="https://aarthicjujjavarapu.github.io/tracechain"
          helm repo index /tmp/helm-repo --url "$REPO_URL" --merge /tmp/helm-repo/index.yaml 2>/dev/null || \
            helm repo index /tmp/helm-repo --url "$REPO_URL"

          # Push to gh-pages
          git checkout --orphan gh-pages-helm 2>/dev/null || git checkout gh-pages
          git checkout origin/gh-pages -- . 2>/dev/null || true
          cp /tmp/helm-repo/index.yaml ./index.yaml
          cp /tmp/helm-repo/*.tgz ./
          git add index.yaml *.tgz
          git commit -m "helm: publish chart $(helm show chart helm/tracechain | grep '^version:' | awk '{print $2}')" || true
          git push origin HEAD:gh-pages --force
